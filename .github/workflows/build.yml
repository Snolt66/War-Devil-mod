name: Build War Devil

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: NeoForge 26.1.2 / Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Restore War Devil animations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/resources/assets/wardevil/neoforge/animations/entity
          cat ci/anims.part* | base64 -d > /tmp/wardevil-anims.zip
          unzip -o /tmp/wardevil-anims.zip -d src/main/resources/assets/wardevil/neoforge/animations/entity
          ANIM_COUNT="$(find src/main/resources/assets/wardevil/neoforge/animations/entity -maxdepth 1 -name 'war_*.json' | wc -l | tr -d ' ')"
          echo "Restored animation JSON count: ${ANIM_COUNT}"
          test "${ANIM_COUNT}" -eq 22

      - name: Build War Devil
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --warning-mode all 2>&1 | tee github-build.log

      - name: Verify JAR animation resources
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' | head -n 1)"
          test -n "${JAR}"
          COUNT="$(unzip -Z1 "${JAR}" | grep -E '^assets/wardevil/neoforge/animations/entity/war_.*\.json$' | wc -l | tr -d ' ')"
          echo "Animation JSONs in JAR: ${COUNT}"
          test "${COUNT}" -eq 22

      - name: Upload War Devil JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: War-Devil-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: War-Devil-Build-Log
          path: github-build.log
          if-no-files-found: warn
          retention-days: 30

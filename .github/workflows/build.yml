name: Build War Devil

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: NeoForge 26.1.2 / Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build War Devil
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --warning-mode all 2>&1 | tee github-build.log

      - name: Upload War Devil JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: War-Devil-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: War-Devil-Build-Log
          path: github-build.log
          if-no-files-found: warn
          retention-days: 30
